---
# Image officielle AdGuard Home : multi-architecture (linux/arm/v7 inclus).
# Le Supervisor construit l'add-on directement sur l'iHost à partir de ce tag.
# Pour mettre à jour : changer le tag ici, dans le Dockerfile et la version
# dans config.yaml, puis ajouter une entrée au CHANGELOG.
build_from:
  armv7: adguard/adguardhome:v0.107.80
  aarch64: adguard/adguardhome:v0.107.80
  amd64: adguard/adguardhome:v0.107.80
