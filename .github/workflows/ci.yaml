---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint de l'add-on (schéma Home Assistant)
        uses: frenck/action-addon-linter@v2
        with:
          path: "./adguard_ihost"

      - name: yamllint
        run: pipx run yamllint --strict .

      - name: shellcheck
        run: shellcheck adguard_ihost/run.sh tests/smoke_test.sh

      - name: Versions cohérentes (config.yaml, build.yaml, Dockerfile, CHANGELOG)
        run: |
          version="$(yq '.version' adguard_ihost/config.yaml)"
          image="adguard/adguardhome:v${version}"
          for arch in $(yq '.arch[]' adguard_ihost/config.yaml); do
            test "$(yq ".build_from.${arch}" adguard_ihost/build.yaml)" = "${image}"
          done
          grep -q "^ARG BUILD_FROM=${image}$" adguard_ihost/Dockerfile
          grep -q "^## ${version}$" adguard_ihost/CHANGELOG.md
          echo "Version ${version} cohérente partout"

  build:
    name: Build et test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build (comme le Supervisor)
        run: |
          base="$(yq '.build_from.${{ matrix.arch }}' adguard_ihost/build.yaml)"
          docker buildx build --load \
            --platform "${{ matrix.platform }}" \
            --build-arg "BUILD_FROM=${base}" \
            --build-arg "BUILD_ARCH=${{ matrix.arch }}" \
            --tag adguard_ihost:test \
            adguard_ihost

      - name: Test de fumée
        run: tests/smoke_test.sh adguard_ihost:test "${{ matrix.platform }}"
